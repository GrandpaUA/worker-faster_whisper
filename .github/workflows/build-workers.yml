name: Build Workers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build-workers.yml"
      - "Dockerfile"
      - "Dockerfile.separate"
      - "builder/**"
      - "src/**"
      - "styletts2/**"
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker image to build"
        type: choice
        default: all
        options:
          - all
          - whisper_asr
          - separate_audio
          - styletts2_ua
      nocache:
        description: "Build without cached layers"
        type: boolean
        default: false
      whisper_models:
        description: "Comma-separated Whisper models to prefetch"
        type: string
        default: "large-v2"

permissions:
  contents: read

concurrency:
  group: build-workers-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.worker || 'push' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: whisper_asr
            image: drgrandpa/whisper-worker
            context: .
            dockerfile: Dockerfile
            cache_scope: whisper-asr
          - worker: separate_audio
            image: drgrandpa/separate-worker
            context: .
            dockerfile: Dockerfile.separate
            cache_scope: separate-audio
          - worker: styletts2_ua
            image: drgrandpa/styletts2-ua
            context: styletts2
            dockerfile: styletts2/Dockerfile
            cache_scope: styletts2-ua

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.worker == 'all' || inputs.worker == matrix.worker }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.worker == 'all' || inputs.worker == matrix.worker }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push whisper_asr
        if: ${{ matrix.worker == 'whisper_asr' && (github.event_name != 'workflow_dispatch' || inputs.worker == 'all' || inputs.worker == matrix.worker) }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            WHISPER_MODELS=${{ github.event_name == 'workflow_dispatch' && inputs.whisper_models || 'large-v2' }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.nocache }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Build and push separate_audio
        if: ${{ matrix.worker == 'separate_audio' && (github.event_name != 'workflow_dispatch' || inputs.worker == 'all' || inputs.worker == matrix.worker) }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.nocache }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Build and push styletts2_ua
        if: ${{ matrix.worker == 'styletts2_ua' && (github.event_name != 'workflow_dispatch' || inputs.worker == 'all' || inputs.worker == matrix.worker) }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.nocache }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max
